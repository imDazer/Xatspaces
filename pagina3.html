<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090706">
<title>Mi espacio · Halloween</title>

<style>
* { box-sizing: border-box; }
html { background: #090706; color-scheme: dark; }
body {
  margin: 0;
  color: #fff0e5;
  font-family: Arial, sans-serif;
}

.space {
  position: relative;
  isolation: isolate;
  min-height: 100svh;
  overflow: hidden;
  display: grid;
  place-items: center;
  padding: 60px 24px;
  background:
    radial-gradient(ellipse at 50% 15%, #76250935, transparent 60%),
    radial-gradient(ellipse at 90% 85%, #a536091c, transparent 45%),
    #090706;
}

.space::before {
  content: "";
  position: absolute;
  inset: 16px;
  border: 1px solid #ff760a35;
  pointer-events: none;
}

.space::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 100;
  background: #000;
  opacity: 0;
  pointer-events: none;
  animation: darkness 8s ease-in-out infinite;
}

.halo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(85vw, 650px);
  aspect-ratio: 1;
  border: 1px solid #ff8c3866;
  border-radius: 50%;
  box-shadow: 0 0 50px #ff620025, inset 0 0 50px #ff620025;
  transform: translate(-50%, -50%);
  animation: glow 7s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: -1;
}

.halo::after {
  content: "";
  position: absolute;
  inset: 18px;
  border: 1px dashed #ff760a25;
  border-radius: 50%;
}

.fog {
  position: absolute;
  inset: 20% -50% -30%;
  background:
    radial-gradient(ellipse at 25% 60%, #aa998522, transparent 40%),
    radial-gradient(ellipse at 65% 75%, #b67b5025, transparent 38%);
  filter: blur(35px);
  animation: drift 24s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: -1;
}

.sparks, .bats {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: -1;
}

.spark {
  position: absolute;
  bottom: -12px;
  left: var(--x);
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: #ffb35c;
  box-shadow: 0 0 12px #ff6600;
  opacity: 0;
  animation: rise var(--duration) linear infinite;
  animation-delay: var(--delay);
}

/* Murciélagos que cruzan de lado a lado. */
.bat {
  position: absolute;
  left: -100px;
  top: var(--top);
  font-size: var(--size);
  opacity: .65;
  animation: fly var(--duration) linear infinite;
  animation-delay: var(--delay);
}

.bat.reverse {
  left: auto;
  right: -100px;
  animation-name: flyBack;
}

.bat span {
  display: block;
  filter: grayscale(1) brightness(.65)
          drop-shadow(0 0 5px #ff7b00aa);
  animation: flutter .65s ease-in-out infinite alternate;
}

.content {
  width: min(100%, 720px);
  text-align: center;
}

.eyebrow {
  color: #dfaa82;
  font-size: .8rem;
  letter-spacing: .23em;
  text-transform: uppercase;
  line-height: 1.7;
}

.pumpkin {
  display: block;
  margin: 30px 0 18px;
  font-size: 3.5rem;
  filter: drop-shadow(0 0 24px #ff680080);
  animation: float 6s ease-in-out infinite;
}

h1 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: clamp(3rem, 12vw, 6.5rem);
  font-weight: normal;
  line-height: 1.1;
  letter-spacing: -.045em;
  color: #ffb46b;
  text-shadow: 0 0 10px #ff6a00aa, 0 0 40px #ff6a0066;
  overflow-wrap: anywhere;
}

.subtitle {
  margin: 24px 0 36px;
  color: #d3bba9;
  font: italic 1.15rem/1.7 Georgia, serif;
}

.divider {
  width: 180px;
  height: 1px;
  margin: 0 auto 36px;
  background: linear-gradient(90deg, transparent, #ff760a, transparent);
  box-shadow: 0 0 18px #ff6a0040;
}

.player {
  width: min(100%, 390px);
  margin: auto;
  padding: 18px;
  border: 1px solid #ff760a70;
  border-radius: 16px;
  text-align: left;
  background: linear-gradient(135deg, #28170fee, #100c0aee);
  box-shadow: 0 0 30px #ff620018, 0 20px 50px #0006;
}

.player-row {
  display: flex;
  align-items: center;
  gap: 15px;
}

button { font: inherit; cursor: pointer; }

.play {
  flex-shrink: 0;
  width: 48px;
  height: 48px;
  border: 1px solid #ffab63;
  border-radius: 50%;
  color: #160a03;
  font-size: 1.2rem;
  background: #ff8c32;
  box-shadow: 0 0 20px #ff6a0045;
}

.play:hover { background: #ffb570; }
.track { min-width: 0; flex: 1; }
.track strong {
  display: block;
  font-size: 1.05rem;
  overflow-wrap: anywhere;
}
.track span {
  display: block;
  margin-top: 6px;
  color: #c7ad99;
  font-size: .875rem;
}

.equalizer {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 28px;
}
.equalizer i {
  width: 3px;
  height: 6px;
  border-radius: 4px;
  background: #ff9b50;
}
.playing .equalizer i {
  animation: bars .8s ease-in-out infinite alternate;
}
.equalizer i:nth-child(2) { animation-delay: -.4s; }
.equalizer i:nth-child(3) { animation-delay: -.2s; }
.equalizer i:nth-child(4) { animation-delay: -.6s; }

.volume {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 18px;
  color: #d2b29b;
  font-size: .875rem;
}
.volume input {
  width: 100%;
  min-width: 0;
  accent-color: #ff8c32;
}
.status {
  margin: 12px 0 0;
  color: #d2b29b;
  font-size: .8rem;
  line-height: 1.5;
}
.footer {
  margin-top: 32px;
  color: #b69882;
  font-size: .8rem;
  letter-spacing: .1em;
  line-height: 1.7;
}
.effects {
  margin-top: 14px;
  padding: 9px 14px;
  color: #dab59a;
  border: 1px solid #ff760a40;
  border-radius: 20px;
  background: #140e0a;
  font-size: .8rem;
}

button:focus-visible, input:focus-visible {
  outline: 2px solid #ffd1a6;
  outline-offset: 5px;
}

/* Mantiene visibles los controles al navegar con teclado. */
.space:has(:focus-visible)::after {
  animation: none;
  opacity: 0;
}
.space.paused *,
.space.paused *::after {
  animation-play-state: paused !important;
}
.space.paused::after {
  animation: none;
  opacity: 0;
}

@keyframes darkness {
  0%, 100% { opacity: 0; }
  50% { opacity: .88; }
}
@keyframes glow {
  from { opacity: .35; }
  to { opacity: .9; }
}
@keyframes drift {
  from { transform: translateX(-8%); }
  to { transform: translateX(8%); }
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-10px) rotate(4deg); }
}
@keyframes bars {
  from { height: 5px; }
  to { height: 26px; }
}
@keyframes rise {
  0% { transform: translate(0, 0); opacity: 0; }
  15% { opacity: .7; }
  85% { opacity: .3; }
  100% {
    transform: translate(var(--travel), -110svh);
    opacity: 0;
  }
}
@keyframes fly {
  0% { transform: translate(0, 0) rotate(-8deg); }
  25% { transform: translate(calc(25vw + 50px), -30px) rotate(6deg); }
  50% { transform: translate(calc(50vw + 100px), 20px) rotate(-5deg); }
  75% { transform: translate(calc(75vw + 150px), -25px) rotate(5deg); }
  100% { transform: translate(calc(100vw + 200px), 0) rotate(-8deg); }
}
@keyframes flyBack {
  0% { transform: translate(0, 0); }
  35% { transform: translate(calc(-35vw - 70px), 35px); }
  70% { transform: translate(calc(-70vw - 140px), -25px); }
  100% { transform: translate(calc(-100vw - 200px), 0); }
}
@keyframes flutter {
  from { transform: scaleY(.75) rotate(-7deg); }
  to { transform: scaleY(1) rotate(7deg); }
}

@media (prefers-reduced-motion: reduce) {
  .space::after, .space *, .space *::after {
    animation: none !important;
  }
  .space::after { opacity: 0; }
  .spark, .bats, .effects { display: none; }
}
</style>
</head>

<body>
<main class="space" id="space">
  <div class="halo" aria-hidden="true"></div>
  <div class="fog" aria-hidden="true"></div>
  <div class="sparks" id="sparks" aria-hidden="true"></div>

  <div class="bats" aria-hidden="true">
    <div class="bat"
      style="--top:12%;--size:45px;--duration:19s;--delay:-3s">
      <span>🦇</span>
    </div>
    <div class="bat reverse"
      style="--top:23%;--size:30px;--duration:25s;--delay:-12s">
      <span>🦇</span>
    </div>
    <div class="bat"
      style="--top:38%;--size:25px;--duration:23s;--delay:-17s">
      <span>🦇</span>
    </div>
    <div class="bat reverse"
      style="--top:65%;--size:48px;--duration:21s;--delay:-6s">
      <span>🦇</span>
    </div>
    <div class="bat"
      style="--top:82%;--size:35px;--duration:27s;--delay:-14s">
      <span>🦇</span>
    </div>
    <div class="bat reverse"
      style="--top:90%;--size:23px;--duration:30s;--delay:-22s">
      <span>🦇</span>
    </div>
  </div>

  <div class="content">
    <p class="eyebrow">El otro lado de la medianoche</p>
    <span class="pumpkin" aria-hidden="true">🎃</span>

    <!-- CAMBIA ESTE TEXTO POR TU APODO -->
    <h1>Dazz (101314)</h1>

    <p class="subtitle">
      Hay noches que no terminan al despertar.
    </p>

    <div class="divider" aria-hidden="true"></div>

    <section class="player" id="player"
      aria-label="Reproductor de música">
      <div class="player-row">
        <button class="play" id="play" type="button"
          aria-label="Reproducir música">▶</button>

        <div class="track">
          <strong>Nightmare</strong>
          <span>Avenged Sevenfold</span>
        </div>

        <div class="equalizer" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </div>
      </div>

      <label class="volume">
        Volumen
        <input id="volume" type="range"
          min="0" max="1" step="0.01" value="0.6">
      </label>

      <p class="status" id="status" role="status">
        Preparando música…
      </p>
    </section>

    <p class="footer">BIENVENIDO A MI LADO OSCURO</p>

    <button class="effects" id="effects" type="button"
      aria-pressed="false">
      Pausar efectos
    </button>

    <noscript>
      <p>Activa JavaScript para usar el reproductor.</p>
    </noscript>
  </div>

  <!--
    CAMBIA TU-CANCION.mp3 POR EL NOMBRE DE TU AUDIO.
    Sube el archivo a la misma carpeta que este HTML.
  -->
  <audio id="audio" src="Aven.mp3"
    autoplay loop preload="auto"></audio>
</main>

<script>
(() => {
  const audio = document.getElementById("audio");
  const play = document.getElementById("play");
  const player = document.getElementById("player");
  const status = document.getElementById("status");
  const volume = document.getElementById("volume");
  const space = document.getElementById("space");
  const effects = document.getElementById("effects");

  audio.volume = Number(volume.value);

  function showError() {
    status.textContent =
      "No se pudo cargar el audio. Revisa el nombre y la ubicación del archivo.";
  }

  async function startMusic() {
    try {
      await audio.play();
    } catch (error) {
      if (audio.error || error.name === "NotSupportedError") {
        showError();
      } else if (error.name === "NotAllowedError") {
        status.textContent = "Pulsa ▶ para iniciar la música.";
      } else {
        status.textContent = "Pulsa ▶ para intentar reproducir.";
      }
    }
  }

  play.addEventListener("click", () => {
    if (audio.paused) startMusic();
    else audio.pause();
  });

  audio.addEventListener("playing", () => {
    player.classList.add("playing");
    play.textContent = "❚❚";
    play.setAttribute("aria-label", "Pausar música");
    status.textContent = "Reproduciendo · Repetición activada";
  });

  audio.addEventListener("pause", () => {
    player.classList.remove("playing");
    play.textContent = "▶";
    play.setAttribute("aria-label", "Reproducir música");
    status.textContent = "Música en pausa";
  });

  audio.addEventListener("waiting", () => {
    player.classList.remove("playing");
    status.textContent = "Cargando música…";
  });

  audio.addEventListener("error", () => {
    player.classList.remove("playing");
    play.textContent = "▶";
    play.setAttribute("aria-label", "Reproducir música");
    showError();
  });

  volume.addEventListener("input", () => {
    audio.volume = Number(volume.value);
  });

  effects.addEventListener("click", () => {
    const paused = space.classList.toggle("paused");
    effects.setAttribute("aria-pressed", String(paused));
    effects.textContent = paused
      ? "Activar efectos"
      : "Pausar efectos";
  });

  const fragment = document.createDocumentFragment();

  for (let i = 0; i < 30; i++) {
    const spark = document.createElement("i");
    spark.className = "spark";
    spark.style.setProperty("--x", Math.random() * 100 + "%");
    spark.style.setProperty("--size", 1 + Math.random() * 3 + "px");
    spark.style.setProperty("--duration", 10 + Math.random() * 15 + "s");
    spark.style.setProperty("--delay", -Math.random() * 25 + "s");
    spark.style.setProperty("--travel", Math.random() * 160 - 80 + "px");
    fragment.appendChild(spark);
  }

  document.getElementById("sparks").appendChild(fragment);

  // Si el navegador bloquea el inicio automático,
  // el visitante puede pulsar el botón del reproductor.
  startMusic();
})();
</script>
</body>
</html>
